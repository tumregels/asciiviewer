[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asciiviewer"
dynamic = ["version"]
description = "A pretty viewer for XSM files generated by DRAGON, DONJON or APOLLO neutronic codes"
readme = "README.md"
license = { text = "GPLv3" }
requires-python = ">=3.10"
authors = [{ name = "tumregels" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Other Environment",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Desktop Environment",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "six==1.17.0",
    "wxPython>=4.2.5",
]

[project.urls]
Homepage = "https://github.com/tumregels/asciiviewer"

[project.scripts]
asciiviewer = "asciiviewer.main:main"

[tool.setuptools]
packages = ["asciiviewer"]

[tool.setuptools.dynamic]
version = { attr = "asciiviewer._version.__version__" }

[tool.setuptools.package-data]
asciiviewer = ["assets/*", "examples/*"]

[dependency-groups]
dev = ["bump2version", "pyinstaller"]

[tool.uv.sources]
wxpython = { index = "wxpython-linux", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "wxpython-linux"
url = "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/"
format = "flat"
explicit = true
