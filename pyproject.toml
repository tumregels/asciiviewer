[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asciiviewer"
dynamic = ["version"]
description = "A pretty viewer for XSM files generated by DRAGON, DONJON or APOLLO neutronic codes"
readme = "README.md"
license = { text = "GPLv3" }
requires-python = ">=3.10"
authors = [{ name = "tumregels" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Other Environment",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Desktop Environment",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "wxPython>=4.3.1",
]

[project.urls]
Homepage = "https://github.com/tumregels/asciiviewer"

[project.scripts]
asciiviewer = "asciiviewer.main:main"

[project.optional-dependencies]
dev = ["bump2version", "build", "pyinstaller", "ruff"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
extend-select = ["I"]
# UP031: %-formatting can be a bit faster than f-strings, especially with format specs
ignore = ["UP031"]

[tool.setuptools]
packages = ["asciiviewer", "asciiviewer.parser"]

[tool.setuptools.dynamic]
version = { attr = "asciiviewer._version.__version__" }

[tool.setuptools.package-data]
asciiviewer = ["assets/*", "examples/*"]
