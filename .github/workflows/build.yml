name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: uv sync

    - name: Create binary
      run: uv run pyinstaller --clean -y --dist ./dist/linux ./asciiviewer.spec

    - uses: actions/upload-artifact@v4
      with:
        name: asciiviewer-linux
        path: ./dist/linux

  macos:
    runs-on: macos-latest
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: uv sync

    - name: Create macos app
      run: |
        uv run pyinstaller --clean -y --dist ./dist/macos ./asciiviewer.spec
        rm -rf ./dist/macos/asciiviewer

    - uses: actions/upload-artifact@v4
      with:
        name: asciiviewer-macos
        path: ./dist/macos

  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: uv sync

    - name: Create binary
      run: uv run pyinstaller --clean -y --dist .\dist\windows64 .\asciiviewer.spec

    - uses: actions/upload-artifact@v4
      with:
        name: asciiviewer-windows64
        path: .\dist\windows64
