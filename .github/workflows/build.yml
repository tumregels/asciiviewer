name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

defaults:
  run:
    shell: bash -el {0}

jobs:

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
    - uses: actions/checkout@v7

    - uses: conda-incubator/setup-miniconda@v4
      with:
        environment-file: environment.yml
        activate-environment: asciiviewer

    - name: Detect OS label
      run: |
        . /etc/os-release
        echo "OS_LABEL=${ID}-${VERSION_ID}" >> "$GITHUB_ENV"

    - name: Create binary
      run: pyinstaller --clean -y --dist ./dist/linux ./asciiviewer.spec

    - uses: actions/upload-artifact@v7
      with:
        name: asciiviewer-${{ env.OS_LABEL }}
        path: ./dist/linux

  macos:
    runs-on: macos-latest
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
    - uses: actions/checkout@v7

    - uses: conda-incubator/setup-miniconda@v4
      with:
        environment-file: environment.yml
        activate-environment: asciiviewer

    - name: Detect OS label
      run: echo "OS_LABEL=macos-$(sw_vers -productVersion | cut -d. -f1)" >> "$GITHUB_ENV"

    - name: Create macos app
      run: |
        pyinstaller --clean -y --dist ./dist/macos ./asciiviewer.spec
        rm -rf ./dist/macos/asciiviewer

    - uses: actions/upload-artifact@v7
      with:
        name: asciiviewer-${{ env.OS_LABEL }}
        path: ./dist/macos

  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
    - uses: actions/checkout@v7

    - uses: conda-incubator/setup-miniconda@v4
      with:
        environment-file: environment.yml
        activate-environment: asciiviewer

    - name: Detect OS label
      shell: pwsh
      run: |
        $caption = (Get-CimInstance Win32_OperatingSystem).Caption
        $year = [regex]::Match($caption, '\d{4}').Value
        echo "OS_LABEL=windows-$year" >> $env:GITHUB_ENV

    - name: Create binary
      run: pyinstaller --clean -y --dist ./dist/windows64 ./asciiviewer.spec

    - uses: actions/upload-artifact@v7
      with:
        name: asciiviewer-${{ env.OS_LABEL }}
        path: ./dist/windows64
