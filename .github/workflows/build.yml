name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

defaults:
  run:
    shell: bash -el {0}

jobs:

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
    - uses: actions/checkout@v7

    - uses: conda-incubator/setup-miniconda@v4
      with:
        environment-file: environment.yml
        activate-environment: asciiviewer

    - name: Detect OS label
      run: |
        . /etc/os-release
        echo "OS_LABEL=${ID}-${VERSION_ID}-$(uname -m)" >> "$GITHUB_ENV"

    - name: Create binary
      run: pyinstaller --clean -y --dist ./dist/linux ./asciiviewer.spec

    - uses: actions/upload-artifact@v7
      with:
        name: asciiviewer-${{ env.OS_LABEL }}
        path: ./dist/linux

  linux-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    strategy:
      fail-fast: false
      matrix:
        image: [ centos:7, ubuntu:20.04 ]

    steps:
    - uses: actions/checkout@v7

    - name: Detect OS label
      run: |
        OS_LABEL=$(docker run --rm ${{ matrix.image }} sh -c '. /etc/os-release; echo ${ID}-${VERSION_ID}-$(uname -m)')
        echo "OS_LABEL=$OS_LABEL" >> "$GITHUB_ENV"

    - name: Create binary
      run: |
        docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace ${{ matrix.image }} \
          bash .github/scripts/build-legacy-linux.sh

    - uses: actions/upload-artifact@v7
      with:
        name: asciiviewer-${{ env.OS_LABEL }}
        path: ./dist/linux

  macos:
    runs-on: macos-latest
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    env:
      # macos-latest runners are Apple Silicon (arm64), so macOS 11 (Big Sur) is the actual
      # floor regardless - it's the first macOS release with arm64 support at all, and it
      # matches conda-forge's own osx-arm64 build target. Without this, clang defaults the
      # declared minimum to the runner's own (much newer) macOS version.
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
    - uses: actions/checkout@v7

    - uses: conda-incubator/setup-miniconda@v4
      with:
        environment-file: environment.yml
        activate-environment: asciiviewer

    - name: Detect OS label
      run: echo "OS_LABEL=macos-$(sw_vers -productVersion | cut -d. -f1)-$(uname -m)" >> "$GITHUB_ENV"

    - name: Create macos app
      run: |
        pyinstaller --clean -y --dist ./dist/macos ./asciiviewer.spec
        rm -rf ./dist/macos/asciiviewer

    - name: Zip binary
      run: |
        # actions/upload-artifact zips directories itself, but it dereferences symlinks and
        # breaks the app bundle's code signature (the onedir build's Contents/Resources ->
        # Contents/Frameworks symlinks get turned into duplicate real files, invalidating the
        # signature seal and producing "app is damaged" on download). Zip it ourselves with
        # ditto, which preserves symlinks and keeps resource-fork metadata out of the bundle
        # tree (--sequesterRsrc), and upload that instead.
        cd ./dist/macos
        ditto -c -k --keepParent --sequesterRsrc asciiviewer.app "asciiviewer-${OS_LABEL}.zip"

    - uses: actions/upload-artifact@v7
      with:
        name: asciiviewer-${{ env.OS_LABEL }}
        path: ./dist/macos/asciiviewer-${{ env.OS_LABEL }}.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
    - uses: actions/checkout@v7

    - uses: conda-incubator/setup-miniconda@v4
      with:
        environment-file: environment.yml
        activate-environment: asciiviewer

    - name: Detect OS label
      shell: pwsh
      run: |
        $caption = (Get-CimInstance Win32_OperatingSystem).Caption
        $year = [regex]::Match($caption, '\d{4}').Value
        $arch = $env:PROCESSOR_ARCHITECTURE.ToLower()
        echo "OS_LABEL=windows-$year-$arch" >> $env:GITHUB_ENV

    - name: Create binary
      run: pyinstaller --clean -y --dist ./dist/windows64 ./asciiviewer.spec

    - uses: actions/upload-artifact@v7
      with:
        name: asciiviewer-${{ env.OS_LABEL }}
        path: ./dist/windows64
