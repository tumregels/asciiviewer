name: Build and Release Assets

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:

  linux:
    # pinned to match the wxPython wheel published for ubuntu-24.04 at
    # https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v9.0.0

    - name: Install dependencies
      run: uv sync

    - name: Create binary
      run: uv run pyinstaller --clean -y --dist ./dist/linux ./asciiviewer.spec

    - name: Zip binary
      run: |
        cd ./dist/linux
        zip asciiviewer-linux-${{ github.ref_name }}.zip asciiviewer

    - uses: actions/upload-artifact@v7
      with:
        name: asciiviewer-linux
        path: ./dist/linux/asciiviewer-linux-${{ github.ref_name }}.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v9.0.0

    - name: Install dependencies
      run: uv sync

    - name: Create macos app
      run: |
        uv run pyinstaller --clean -y --dist ./dist/macos ./asciiviewer.spec
        rm -rf ./dist/macos/asciiviewer

    - name: Zip binary
      run: |
        cd ./dist/macos
        zip -r asciiviewer-macos-${{ github.ref_name }}.zip .

    - uses: actions/upload-artifact@v7
      with:
        name: asciiviewer-macos
        path: ./dist/macos/asciiviewer-macos-${{ github.ref_name }}.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v9.0.0

    - name: Install dependencies
      run: uv sync

    - name: Create binary
      run: uv run pyinstaller --clean -y --dist .\dist\windows .\asciiviewer.spec

    - name: Zip binary
      run: |
        cd .\dist\windows
        powershell Compress-Archive asciiviewer.exe asciiviewer-windows-${{ github.ref_name }}.zip

    - uses: actions/upload-artifact@v7
      with:
        name: asciiviewer-windows
        path: .\dist\windows\asciiviewer-windows-${{ github.ref_name }}.zip

  release:
    needs: [ linux, macos, windows ]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: true
          files: artifacts/*
