name: Build and Release Assets

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

defaults:
  run:
    shell: bash -el {0}

jobs:

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - uses: conda-incubator/setup-miniconda@v4
      with:
        environment-file: environment.yml
        activate-environment: asciiviewer

    - name: Detect OS label
      run: |
        . /etc/os-release
        echo "OS_LABEL=${ID}-${VERSION_ID}" >> "$GITHUB_ENV"

    - name: Create binary
      run: pyinstaller --clean -y --dist ./dist/linux ./asciiviewer.spec

    - name: Zip binary
      run: |
        cd ./dist/linux
        zip "asciiviewer-${OS_LABEL}-${{ github.ref_name }}.zip" asciiviewer

    - uses: actions/upload-artifact@v7
      with:
        name: asciiviewer-${{ env.OS_LABEL }}
        path: ./dist/linux/asciiviewer-${{ env.OS_LABEL }}-${{ github.ref_name }}.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - uses: conda-incubator/setup-miniconda@v4
      with:
        environment-file: environment.yml
        activate-environment: asciiviewer

    - name: Detect OS label
      run: echo "OS_LABEL=macos-$(sw_vers -productVersion | cut -d. -f1)" >> "$GITHUB_ENV"

    - name: Create macos app
      run: |
        pyinstaller --clean -y --dist ./dist/macos ./asciiviewer.spec
        rm -rf ./dist/macos/asciiviewer

    - name: Zip binary
      run: |
        cd ./dist/macos
        zip -r "asciiviewer-${OS_LABEL}-${{ github.ref_name }}.zip" .

    - uses: actions/upload-artifact@v7
      with:
        name: asciiviewer-${{ env.OS_LABEL }}
        path: ./dist/macos/asciiviewer-${{ env.OS_LABEL }}-${{ github.ref_name }}.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - uses: conda-incubator/setup-miniconda@v4
      with:
        environment-file: environment.yml
        activate-environment: asciiviewer

    - name: Detect OS label
      shell: pwsh
      run: |
        $caption = (Get-CimInstance Win32_OperatingSystem).Caption
        $year = [regex]::Match($caption, '\d{4}').Value
        echo "OS_LABEL=windows-$year" >> $env:GITHUB_ENV

    - name: Create binary
      run: pyinstaller --clean -y --dist ./dist/windows ./asciiviewer.spec

    - name: Zip binary
      shell: pwsh
      run: |
        cd .\dist\windows
        Compress-Archive asciiviewer.exe "asciiviewer-$env:OS_LABEL-${{ github.ref_name }}.zip"

    - uses: actions/upload-artifact@v7
      with:
        name: asciiviewer-${{ env.OS_LABEL }}
        path: .\dist\windows\asciiviewer-${{ env.OS_LABEL }}-${{ github.ref_name }}.zip

  release:
    needs: [ linux, macos, windows ]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: true
          files: artifacts/*
